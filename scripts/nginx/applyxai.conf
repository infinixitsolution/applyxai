# ApplyXAI production — Let's Encrypt TLS (certbot)
# Installed to /etc/nginx/sites-available/applyxai by scripts/setup_ssl.sh

server {
    listen 80;
    listen [::]:80;
    server_name applyxai.com www.applyxai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://applyxai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name applyxai.com www.applyxai.com;

    ssl_certificate /etc/letsencrypt/live/applyxai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/applyxai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($host = www.applyxai.com) {
        return 301 https://applyxai.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_comp_level 6;

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000/api/site/robots.txt;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/site/sitemap.xml;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        root /home/ubuntu/applyxai/frontend/dist;
    }

    location / {
        root /home/ubuntu/applyxai/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "no-store";
    }
}
