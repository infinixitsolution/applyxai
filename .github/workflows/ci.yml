name: CI

on:
  push:
    branches: [socialapp, main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r backend/requirements.txt -r requirements-dev.txt
      - name: Alembic on Postgres (optional)
        run: bash scripts/ci_postgres_migrate.sh
        env:
          TEST_POSTGRES_URL: ${{ secrets.TEST_POSTGRES_URL }}
      - name: Pytest
        run: python -m pytest backend/tests -q --tb=no
        env:
          APP_ENV: test
      - name: Outreach mocked tests
        run: python -m pytest backend/tests/test_outreach_api.py backend/tests/test_outreach_automation.py backend/tests/test_outreach_scrape_pipeline.py -q --tb=line
        env:
          APP_ENV: test

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r backend/requirements.txt -r requirements-dev.txt
      - name: Agent packaging and credentials
        run: python -m pytest tests/test_packaging.py tests/test_agent_credentials.py -q --tb=line
        env:
          APP_ENV: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - name: Playwright smokes
        run: npx playwright install --with-deps chromium && npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
